# Copy to <library root>/config.toml, or point $PDF_LIBRARY_CONFIG at it.
# Every value below is the built-in default.

[library]
root = "~/Documents/pdf-library"

[extraction]
# Always runs on import. Fast, local, no models.
fast_engine = "pymupdf4llm"
# Runs only when you ask for it. Produces real LaTeX. Set to "" to disable.
quality_engine = "marker"
# Pages scoring below this are offered for upgrade.
upgrade_below_score = 0.75
# Offer every page holding mathematics, not only the low-scoring ones.
upgrade_math_pages = true
# Upgrade automatically after import. This also runs local vision correction
# for scanned/OCR pages when the MLX-VLM server is available.
auto_upgrade = true
# Cap pages sent to the quality engine per job. 0 means no cap.
max_upgrade_pages = 0

[marker]
executable = "marker_single"
# "", "mps", "cuda" or "cpu". Empty lets marker decide.
torch_device = ""
timeout_seconds = 3600
extra_args = []

[vision]
# Local MLX-VLM/OpenAI-compatible endpoint. Disabled until you start the server.
enabled = true
base_url = "http://127.0.0.1:8080/v1"
# Use any mlx-vlm-compatible vision model available on your Mac.
model = "mlx-community/Qwen3-VL-8B-Instruct-4bit"
timeout_seconds = 300
# Lossless local page render; unlike get_page_image this is not token-budgeted.
render_scale = 3.0
temperature = 0.0
max_tokens = 4096
# Corrected text is only written when confidence meets this threshold.
apply_min_confidence = 0.80
crop_retry = true
min_greek_ratio = 0.35

[search]
max_results = 10
snippet_chars = 320

# Ceilings that keep MCP replies out of your context budget.
[response]
max_search_results = 10
max_snippet_chars = 320
max_page_chars = 12000
max_response_tokens = 6000
# Token budget for a page image, when one is explicitly asked for. An image is
# never returned by any other tool.
max_image_tokens = 900

[chunking]
target_chars = 1800
max_chars = 4000

[repair]
# Optional plain UTF-8 Greek wordlist for conservative OCR prose repair.
# A word changes only when this file supplies one unique allowed candidate.
greek_lexicon = ""
# Full inflection-aware Hunspell dictionary. Leave empty to discover
# <library root>/dictionaries/Greek.{aff,dic} automatically.
greek_hunspell = ""

[safety]
# Zero means unlimited. Set these when the MCP server receives PDFs from
# untrusted callers.
max_pdf_bytes = 0
max_pdf_pages = 0
